<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premisave Listing Console</title>
<style>
:root{
  --canvas:#f4f5f7; --panel:#ffffff; --sunken:#f8f9fb; --hover:#f1f3f6;
  --line:#e3e6eb; --line2:#cdd3db;
  --ink:#14181f; --ink2:#4b5563; --ink3:#7a8494;
  --accent:#0b6b57; --accent-h:#095646; --accent-ink:#ffffff; --accent-soft:#e2f1ed; --accent-line:#a9d5c9;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#a15c07; --warn-soft:#fcf1dc; --bad:#b42318; --bad-soft:#fdecea; --info:#1d4ed8; --info-soft:#e8eefd;
  --side:#0f1419; --side-ink:#a8b2be; --side-dim:#6b7684; --side-hi:#ffffff; --side-line:#1d2530; --side-act:#18212b; --mark:#3cc9a5;
  --pop:0 12px 32px rgba(15,20,25,.18),0 2px 6px rgba(15,20,25,.1);
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --side-w:240px;
}
[data-theme="dark"]{
  --canvas:#0c0f13; --panel:#12171d; --sunken:#0e1217; --hover:#18202a;
  --line:#222a33; --line2:#313b47;
  --ink:#e8ecf1; --ink2:#a3adba; --ink3:#6e7886;
  --accent:#34c3a0; --accent-h:#4cd3b1; --accent-ink:#04231b; --accent-soft:#11302a; --accent-line:#1f5a4c;
  --ok:#4ade80; --ok-soft:#10301e; --warn:#fbbf24; --warn-soft:#33260b; --bad:#f87171; --bad-soft:#3a1816; --info:#7aa2ff; --info-soft:#16223f;
  --side:#080b0e; --side-line:#161d26; --side-act:#121a23;
  --pop:0 14px 36px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--canvas);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em;color:var(--ink)}
h2{font-size:21px;line-height:1.25} h3{font-size:14px} h4{font-size:12.5px;font-weight:600;color:var(--ink2)}
code,pre,.mono{font-family:var(--mono);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--ink2)} .tiny{font-size:12px} .grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.gap-s{gap:6px}
.ic{display:inline-grid;place-items:center;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;z-index:70}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--mark);display:grid;place-items:center;color:#06231b}
.brand b{display:block;color:var(--side-hi);font-size:15px;font-weight:650;letter-spacing:-.015em;line-height:1.1}
.brand small{display:block;color:var(--side-dim);font-size:12px;margin-top:2px}
.nav-title{padding:16px 10px 6px;font-size:12px;color:var(--side-dim);font-weight:500}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--side-ink);cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:#141b24;color:var(--side-hi)}
.nav button.on{background:var(--side-act);color:var(--side-hi)}
.nav button.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--mark)}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.who-box{display:flex;gap:10px;align-items:center;padding:6px 8px 10px}
.avatar{width:30px;height:30px;border-radius:50%;background:#26323f;color:#e6edf3;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.who-box select{background:#141b24;border:1px solid var(--side-line);color:var(--side-hi);height:30px;padding:0 8px;border-radius:6px;width:100%}
.who-box small{display:block;color:var(--side-dim);font-size:12px;line-height:1.2;margin-bottom:3px}
.foot-btn{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border:0;background:none;color:var(--side-ink);border-radius:6px;cursor:pointer;width:100%;text-align:left;font-weight:500}
.foot-btn:hover{background:#141b24;color:var(--side-hi)}
.svc{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--side-dim);font-size:12px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.svc:hover{color:var(--side-hi)}
.content{min-width:0;display:flex;flex-direction:column}
.topline{position:sticky;top:0;z-index:40;background:var(--canvas);border-bottom:1px solid var(--line);min-height:52px;padding:8px 24px;display:flex;align-items:center;gap:12px}
.topline h1{font-size:14px;font-weight:600;white-space:nowrap}
.btn.menu-btn{display:none}
.ctx-tags{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.ctx-tags::-webkit-scrollbar{display:none}
.ctx-tag{flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--ink2);cursor:pointer;max-width:240px}
.ctx-tag b{font-weight:500;color:var(--ink3)}
.ctx-tag span{font:12px var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-tag:hover{border-color:var(--line2)}
.ctx-x{border:0;background:none;color:var(--ink3);cursor:pointer;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;padding:0}
.ctx-x:hover{background:var(--hover);color:var(--ink)}
main{width:100%;max-width:1240px;margin:0 auto;padding:24px 24px 110px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:500;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* controls */
.btn{height:32px;border:1px solid var(--line2);background:var(--panel);padding:0 12px;border-radius:6px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.sun{color:var(--warn);border-color:var(--warn)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px;border-radius:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.busy::after{content:"";width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12px;font-weight:500;color:var(--ink2)}
label.f>span em{font-style:normal;color:var(--ink3);font-weight:400}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=date],input[type=time],input[type=datetime-local],input[type=url],select,input:not([type]){height:32px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:0 10px;width:100%;min-width:0}
textarea{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:8px 10px;width:100%;min-width:0;font:12.5px/1.5 var(--mono);min-height:84px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--ink3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=file]{font-size:12.5px;width:100%}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(256px,1fr))}
.auto-w{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.card.flat{background:var(--sunken)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{flex:1;min-width:0}
.tag{font:12px var(--mono);color:var(--ink3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;font-size:12px;font-weight:500;background:var(--hover);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn,.chip.sun{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.brand{background:var(--accent-soft);color:var(--accent)}
.method{display:inline-block;min-width:46px;text-align:center;font:600 10.5px var(--mono);letter-spacing:.02em;padding:3px 0;border-radius:4px}
.m-GET{background:var(--ok-soft);color:var(--ok)} .m-POST{background:var(--warn-soft);color:var(--warn)} .m-PUT,.m-PATCH{background:var(--info-soft);color:var(--info)} .m-DELETE{background:var(--bad-soft);color:var(--bad)}
.path{font:12px var(--mono);color:var(--ink2);word-break:break-all}
.empty{padding:32px 16px;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13px;margin:0}
.kv dt{color:var(--ink3)} .kv dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.notice{border-radius:6px;padding:9px 12px;font-size:13px;background:var(--info-soft);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 18%,transparent)}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 22%,transparent)}
.notice.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 22%,transparent)}
.notice.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block;flex:none}
.dot.ok{background:#3ccf8e} .dot.bad{background:#ef5b4f}

/* listing cards */
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.lcard:hover{border-color:var(--line2)}
.lcard .ph{position:relative;aspect-ratio:3/2;background:var(--sunken);display:grid;place-items:center;color:var(--ink3);cursor:pointer;overflow:hidden;border-bottom:1px solid var(--line)}
.lcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lcard .ph .tags{position:absolute;left:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap}
.lcard .ph .tags .chip{background:rgba(255,255,255,.94);color:#14181f}
.lcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.lcard .ttl{font-weight:600;font-size:14.5px;cursor:pointer;letter-spacing:-.01em}
.lcard .ttl:hover{color:var(--accent)}
.facts{display:flex;gap:12px;color:var(--ink3);font-size:12.5px;flex-wrap:wrap}
.price{display:flex;flex-wrap:wrap;gap:2px 14px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.price small{font-weight:400;color:var(--ink3);font-size:12.5px}
.lcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.idline{font:11.5px var(--mono);color:var(--ink3);cursor:pointer;word-break:break-all}
.idline:hover{color:var(--accent)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 12px;color:var(--ink3);font-size:12px;font-weight:500;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sunken)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--sunken)}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

/* segmented control */
.pill-tabs{display:inline-flex;background:var(--hover);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.pill-tabs button{border:0;background:none;height:26px;padding:0 11px;border-radius:5px;cursor:pointer;font-weight:500;color:var(--ink2)}
.pill-tabs button:hover{color:var(--ink)}
.pill-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}

/* toolbar for discover */
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.toolbar .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .filters>*{flex:1 1 150px}
.toolbar .filters>.btn{flex:none}

/* endpoint card */
.ep{border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}
.ep-h{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:42px;cursor:pointer}
.ep-h:hover{background:var(--sunken)}
.ep-h b{font-weight:600;white-space:nowrap}
.ep-h .path{flex:1;min-width:0}
.ep-h .car{color:var(--ink3);transition:transform .12s;width:14px;height:14px}
.ep.open .car{transform:rotate(90deg)}
.ep-b{display:none;padding:2px 14px 16px;border-top:1px solid var(--line)}
.ep.open .ep-b{display:block}
.ep-b .desc{color:var(--ink2);margin:12px 0}
.ep-b .grid{margin-top:12px}
.fields{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.res{margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--sunken);overflow:hidden}
.res-h{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.res-b{padding:12px;max-height:480px;overflow:auto}
.pre{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0}
.j-k{color:var(--info)} .j-s{color:var(--ok)} .j-n{color:var(--warn)} .j-b{color:#9a4fb0} .j-z{color:var(--ink3)}
[data-theme="dark"] .j-b{color:#c79bf0}
details.jv>summary{cursor:pointer;list-style:none;font:12px var(--mono)}
details.jv>summary::-webkit-details-marker{display:none}
details.jv>summary::before{content:"+";display:inline-block;width:14px;color:var(--ink3)}
details.jv[open]>summary::before{content:"\2212"}
.jv-in{margin-left:6px;border-left:1px solid var(--line);padding-left:12px;font:12px/1.6 var(--mono)}
.stat{display:inline-block;font:600 11.5px var(--mono);padding:2px 6px;border-radius:4px}
.s2{background:var(--ok-soft);color:var(--ok)} .s3{background:var(--info-soft);color:var(--info)} .s4{background:var(--warn-soft);color:var(--warn)} .s5,.s0{background:var(--bad-soft);color:var(--bad)}

/* calendar */
.cal{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-d{height:34px;display:grid;place-items:center;border-radius:5px;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.cal-d:hover{background:var(--hover)}
.cal-d.dow{color:var(--ink3);font-weight:500;font-size:12px;cursor:default}
.cal-d.dow:hover{background:none}
.cal-d.off{color:var(--ink3);text-decoration:line-through;cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hover) 5px 6px)}
.cal-d.sel{background:var(--accent);color:var(--accent-ink)}
.cal-d.rng{background:var(--accent-soft);color:var(--accent)}
.cal-d.past{opacity:.38}
.cal-d.blank{cursor:default}
.cal-d.blank:hover{background:none}

/* gallery */
.gal{display:flex;flex-direction:column;gap:8px}
.gal .big{position:relative;aspect-ratio:16/9;max-height:340px;border-radius:8px;overflow:hidden;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3)}
.gal .big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:84px;height:60px;padding:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--sunken);cursor:pointer;opacity:.75}
.thumb:hover{opacity:1}
.thumb.on{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgman{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.imgman figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.imgman img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.imgman figcaption{padding:8px;display:flex;gap:5px;flex-wrap:wrap}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,11,14,.5);z-index:90;display:flex;justify-content:flex-end}
.drawer{width:min(800px,100%);background:var(--canvas);height:100%;overflow:auto;box-shadow:var(--pop);animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;min-height:52px;display:flex;align-items:center;gap:10px}
.drawer-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-wrap{position:fixed;inset:0;background:rgba(8,11,14,.55);z-index:110;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(560px,100%);box-shadow:var(--pop);max-height:92vh;overflow:auto}
#toasts{position:fixed;right:16px;bottom:56px;z-index:130;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 32px))}
.toast{background:#171d25;color:#f1f4f8;padding:10px 14px;border-radius:6px;box-shadow:var(--pop);border-left:3px solid #6b7684;animation:slide .14s;font-size:13px}
.toast.bad{border-left-color:#f0655b} .toast.ok{border-left-color:#3ccf8e}

/* request inspector */
.dock{position:fixed;left:var(--side-w);right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line2)}
.dock-bar{display:flex;align-items:center;gap:10px;padding:0 24px;height:38px;cursor:pointer}
.dock-body{height:min(46vh,420px);display:none;border-top:1px solid var(--line)}
.dock.open .dock-body{display:grid;grid-template-columns:minmax(280px,38%) 1fr}
.logl{overflow:auto;border-right:1px solid var(--line)}
.logr{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px}
.logr:hover{background:var(--sunken)}
.logr.on{background:var(--accent-soft)}
.logd{overflow:auto;padding:14px 18px}

/* guide */
.steps{display:grid;gap:14px;padding:0;margin:0;counter-reset:s}
.steps>li{list-style:none;counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.steps>li::before{content:counter(s);width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);display:grid;place-items:center;font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column}
.statusrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.statusrow:last-child{border-bottom:0}

@media(max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-102%);transition:transform .18s}
  .shell.menu-open .side{transform:none;box-shadow:var(--pop)}
  .shell.menu-open::after{content:"";position:fixed;inset:0;background:rgba(8,11,14,.5);z-index:65}
  .btn.menu-btn{display:inline-flex}
  .dock{left:0}
  .topline,.dock-bar{padding-left:14px;padding-right:14px}
  main{padding:18px 14px 110px}
  .g2,.g3,.g4,.auto-w{grid-template-columns:1fr}
  .dock.open .dock-body{grid-template-columns:1fr;grid-template-rows:40% 60%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.toolbar .pill-tabs{align-self:flex-start}
.btn.sm.ghost{color:var(--ink2)}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'html') el.innerHTML = v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  const add = (kid) => {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) return kid.forEach(add);
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  };
  kids.forEach(add);
  return el;
}

function buildUrl(svc, path, query) {
  const base = (S.cfg[svc] || '').replace(/\/+$/, '');
  let url = /^https?:\/\//i.test(path) ? path : base + path;
  if (query) {
    const qs = new URLSearchParams();
    for (const [k, v] of Object.entries(query)) {
      if (v === '' || v === undefined || v === null) continue;
      if (Array.isArray(v)) v.forEach((x) => qs.append(k, x)); else qs.append(k, v);
    }
    const s = qs.toString();
    if (s) url += (url.includes('?') ? '&' : '?') + s;

}

/* Never throws. Network failures come back as status 0. */
async function api(svc, path, o) {

  const tok = o.token !== undefined ? o.token : me().token;
  if (!o.anon && tok) headers.Authorization = 'Bearer ' + tok;
  if (o.apiKey !== undefined ? o.apiKey : false) headers['X-API-Key'] = o.apiKey;
  let body;
  let reqPreview = null;
  if (o.form) { body = o.form; reqPreview = '[multipart form-data]'; }
  else if (o.json !== undefined) { body = JSON.stringify(o.json); headers['Content-Type'] = 'application/json'; reqPreview = o.json; }
  else if (o.raw !== undefined) { body = o.raw; if (!headers['Content-Type']) headers['Content-Type'] = 'application/json'; reqPreview = o.raw; }
  const method = (o.method || 'GET').toUpperCase();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), (S.cfg.timeout || 60) * 1000);
  const t0 = performance.now();
  const entry = { id: ++S.logSeq, t: new Date(), method, url, reqHeaders: maskAuth(headers), reqBody: reqPreview, status: 0, ms: 0, resBody: null, resHeaders: {}, svc };
  let res;
  try {
    const r = await fetch(url, { method, headers, body, signal: ctl.signal });
    const text = await r.text();
    let data = text;
    try { data = text ? JSON.parse(text) : null; } catch (e) { /* plain text */ }
    const rh = {};
    r.headers.forEach((v, k) => { rh[k] = v; });
    res = { ok: r.ok, status: r.status, data, text, headers: rh, ms: Math.round(performance.now() - t0), url, method };
  } catch (e) {
    const aborted = e && e.name === 'AbortError';
    res = {
      ok: false, status: 0, data: null, text: '', headers: {}, ms: Math.round(performance.now() - t0), url, method,
      error: aborted ? 'Timed out after ' + S.cfg.timeout + 's' : 'Network error: ' + (e && e.message || e),
      hint: aborted ? '' : 'The service may be down, or CORS blocked this origin (' + location.origin + '). Add it to CORS_ALLOWED_ORIGINS.'
    };
  } finally { clearTimeout(timer); }
  entry.status = res.status; entry.ms = res.ms; entry.resBody = res.error ? res.error : res.data; entry.resHeaders = res.headers;
  S.log.unshift(entry);
  if (S.log.length > 300) S.log.pop();
  emit('log', entry);
  return res;
}

    res.status === 403 ? h('div', { class: 'notice warn', style: { margin: '10px' } }, 'Forbidden. This persona may lack the required role.') : null,
    body);

}

/* ====================== endpoint cards ====================== */
const EP = {};                 /* key -> spec, filled by endpoints.js */
const EP_BY_ID = {};

function curlOf(method, url, headers, body) {
  const parts = ["curl -X " + method + " '" + url + "'"];
  Object.entries(headers || {}).forEach(([k, v]) => { if (k !== 'Accept') parts.push("  -H '" + k + ': ' + v + "'"); });
  if (body && typeof body === 'string') parts.push("  -d '" + body.replace(/'/g, "'\\''") + "'");
  return parts.join(' \\\n');
}

function readField(f, input) {
  if (f.type === 'bool') return input.checked ? true : (f.sendFalse ? false : undefined);
  if (f.type === 'files') return input.files && input.files.length ? [...input.files] : undefined;
  let v = input.value;
  if (v === '' || v === undefined) return undefined;
  if (f.type === 'number') { const n = Number(v); return Number.isNaN(n) ? undefined : n; }
  if (f.type === 'list') return v.split(',').map((x) => x.trim()).filter(Boolean);
  if (f.type === 'json') { try { return JSON.parse(v); } catch (e) { return { badJson: v }; } }
  if (f.type === 'datetime') return v.length === 16 ? v + ':00' : v;
  return v;
}

function endpointCard(spec, o) {
  o = o || {};
  const inputs = {};
  const fieldsEl = h('div', { class: 'grid fields' });
  const resultHolder = h('div');
  let rawArea = null;
  let idemInput = null;
  let reuse = null;

  (spec.fields || []).forEach((f) => {
    let inp;
    const def = f.ctx ? S.ctx[f.ctx] : (f.def !== undefined ? f.def : '');
    if (f.type === 'select') inp = sel(f.opts, def);
    else if (f.type === 'bool') inp = h('input', { type: 'checkbox', checked: !!f.def });
    else if (f.type === 'textarea' || f.type === 'json') inp = h('textarea', { placeholder: f.ph || '' }, def === undefined ? '' : (typeof def === 'object' ? JSON.stringify(def, null, 2) : def));
    else if (f.type === 'files') inp = h('input', { type: 'file', multiple: f.multiple !== false, accept: 'image/*' });
    else if (f.type === 'date') inp = h('input', { type: 'date', value: def });
    else if (f.type === 'datetime') inp = h('input', { type: 'datetime-local', value: def ? String(def).slice(0, 16) : '' });
    else inp = h('input', { type: f.type === 'number' ? 'number' : 'text', step: f.type === 'number' ? 'any' : undefined, value: def, placeholder: f.ph || '' });
    inp.dataset.field = f.n;
    if (f.ctx) {
      inp.addEventListener('input', () => { inp.dataset.dirty = '1'; });
      let seen = false;
      const sync = (e) => {
        if (inp.isConnected) seen = true; else if (seen) { bus.removeEventListener('ctx', sync); return; }
        if (e.detail.key === f.ctx && !inp.dataset.dirty) inp.value = e.detail.val;
      };
      bus.addEventListener('ctx', sync);
    }
    inputs[f.n] = inp;
    const label = (f.label || f.n) + (f.req ? ' *' : '');
    const wrapEl = f.type === 'bool'
      ? h('label', { class: 'chk' }, inp, label)
      : field(label, inp, f.hint ? '(' + f.hint + ')' : '');
    if (f.wide || f.type === 'textarea' || f.type === 'json') wrapEl.style.gridColumn = '1 / -1';
    fieldsEl.appendChild(wrapEl);
  });

  if (spec.idem) {
    idemInput = h('input', { type: 'text', value: uid() });
    reuse = h('input', { type: 'checkbox' });
    const gen = h('button', { class: 'btn sm', type: 'button', onclick: () => { idemInput.value = uid(); } }, 'New key');
    const box = h('div', { style: { gridColumn: '1 / -1' } },
      field('Idempotency-Key header', h('div', { class: 'row', style: { flexWrap: 'nowrap' } }, idemInput, gen)),
      h('label', { class: 'chk tiny', style: { marginTop: '6px' } }, reuse, 'Keep this key for the next send (tests that a repeat returns the same result)'));
    fieldsEl.appendChild(box);
  }

  const collect = () => {
    const path = spec.path.replace(/\{(\w+)\}/g, (m, n) => {
      const f = (spec.fields || []).find((x) => x.n === n);
      return encodeURIComponent(f ? (inputs[n].value || '') : (S.ctx[n] || ''));
    });
    const query = {}; const body = {}; const files = []; const headers = {};
    (spec.fields || []).forEach((f) => {
      const v = readField(f, inputs[f.n]);
      if (v === undefined) return;
      if (f.in === 'query') query[f.n] = v;
      else if (f.in === 'body') body[f.n] = v;
      else if (f.in === 'file') files.push(...v);
      else if (f.in === 'header') headers[f.n] = v;
    });
    if (spec.fixedQuery) Object.assign(query, spec.fixedQuery);
    return { path, query, body, files, headers };
  };

  const send = async (btn) => {
    const c = collect();
    const bad = (spec.fields || []).filter((f) => f.req && f.in === 'path' && !inputs[f.n].value);
    if (bad.length) { toast('Missing: ' + bad.map((f) => f.n).join(', '), 'bad'); return; }
    const opts = { method: spec.method, query: c.query, headers: Object.assign({}, c.headers) };
    if (spec.auth === 'none') opts.anon = true;
    if (spec.auth === 'apikey') { opts.anon = true; opts.apiKey = S.cfg.apiKey; if (!S.cfg.apiKey) toast('No internal API key set (Settings). Sending without it.', 'bad'); }
    if (spec.auth === 'bearer+key') opts.apiKey = S.cfg.apiKey;
    if (spec.idem) opts.headers['Idempotency-Key'] = idemInput.value;
    if (spec.body === 'json') {
      const raw = rawArea && rawArea.value.trim();
      if (raw) opts.raw = raw; else if (Object.keys(c.body).length || spec.sendEmptyBody) opts.json = c.body;
      if (spec.bodyFrom) opts.json = spec.bodyFrom(c.body);
    } else if (spec.body === 'multipart') {
      const fd = new FormData();
      const raw = rawArea && rawArea.value.trim();
      const reqJson = raw || (spec.rawField ? inputs[spec.rawField].value : JSON.stringify(c.body));
      if (spec.reqPart) fd.append('request', new Blob([reqJson], { type: 'application/json' }));
      c.files.forEach((f) => fd.append('files', f, f.name));
      opts.form = fd;
    }
    const res = await withBusy(btn, () => api(spec.svc, c.path, opts));
    if (spec.idem && res.status && !reuse.checked) idemInput.value = uid();
    const extra = { refresh: () => send(btn) };
    if (inputs.page) extra.goPage = (p) => { inputs.page.value = p; send(btn); };
    clear(resultHolder).appendChild(resultBox(res, Object.assign(extra, spec.hooks || {})));
    if (res.ok) {
      const d = unwrap(res.data);
      if (spec.capture) spec.capture(d, res);
      if (spec.after) spec.after(res);
    }
    if (o.onResult) o.onResult(res);
    return res;
  };

  const sendBtn = h('button', { class: 'btn primary', onclick: (e) => send(e.currentTarget) }, 'Send');
  const hasBody = spec.body === 'json' || spec.body === 'multipart';
  const actions = h('div', { class: 'row', style: { marginTop: '12px' } }, sendBtn,
    hasBody ? h('button', { class: 'btn sm', type: 'button', onclick: () => {
      if (rawArea) { rawArea.remove(); rawArea = null; return; }
      const c = collect();
      rawArea = h('textarea', { style: { gridColumn: '1 / -1', minHeight: '120px' } }, JSON.stringify(spec.bodyFrom ? spec.bodyFrom(c.body) : c.body, null, 2));
      fieldsEl.appendChild(rawArea);
    } }, 'Edit raw JSON') : null,
    h('button', { class: 'btn sm', type: 'button', onclick: () => {
      const c = collect();
      const headers = Object.assign({ Authorization: 'Bearer ' + me().token }, c.headers);
      if (spec.idem) headers['Idempotency-Key'] = idemInput.value;
      copy(curlOf(spec.method, buildUrl(spec.svc, c.path, c.query), headers, hasBody ? JSON.stringify(c.body) : ''), 'cURL');
    } }, 'Copy cURL'));

  const card = h('div', { class: 'ep' + (o.open ? ' open' : ''), 'data-ep': spec.method + ' ' + spec.path },
    h('div', { class: 'ep-h', onclick: (e) => { if (e.target.closest('button')) return; card.classList.toggle('open'); } },
      h('span', { class: 'method m-' + spec.method }, spec.method),
      h('b', null, spec.title),
      h('span', { class: 'path' }, spec.path),
      spec.roles ? h('span', { class: 'chip warn' }, spec.roles) : null,
      icon('chevron', 14, 'car')),
    h('div', { class: 'ep-b' },
      spec.desc ? h('div', { class: 'desc' }, spec.desc) : null,
      fieldsEl, actions, resultHolder));
  card.send = () => send(sendBtn);
  return card;
}

function epCards(keys, o) {
  return keys.map((k) => {
    const spec = EP[k];
    if (!spec) return h('div', { class: 'notice bad' }, 'Missing endpoint spec: ' + k);
    return endpointCard(spec, o);
  });
}

/* ====================== calendar ====================== */
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

/* A month grid fed by GET /listings/{id}/availability. Click a day, then another, to pick a range. */
function availabilityCalendar(listingId, opts) {
  opts = opts || {};
  let cur = new Date(); cur.setDate(1);
  let off = new Set();
  let start = null; let end = null;
  const box = h('div', { class: 'cal' });
  const note = h('div', { class: 'muted tiny', style: { marginTop: '6px' } });

  async function load() {
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    const res = await api('listing', '/listings/' + encodeURIComponent(listingId) + '/availability', { query: { from: ymd(first), to: ymd(last) }, anon: true });
    off = new Set();
    if (res.ok) {
      const d = unwrap(res.data) || {};
      (d.unavailableDates || []).forEach((x) => off.add(String(x).slice(0, 10)));
      note.textContent = off.size + ' unavailable date(s) this month.';
    } else note.textContent = 'Availability: ' + errText(res);
    draw();
  }

  function pick(day) {
    if (!start || (start && end)) { start = day; end = null; }
    else if (day > start) { end = day; }
    else { start = day; end = null; }
    if (opts.onRange) opts.onRange(start, end);
    draw();
  }

  function draw() {
    clear(box);
    const y = cur.getFullYear(); const m = cur.getMonth();
    box.appendChild(h('div', { class: 'cal-h' },
      h('button', { class: 'btn sm', onclick: () => { cur = new Date(y, m - 1, 1); load(); } }, 'Prev'),
      h('span', null, MONTHS[m] + ' ' + y),
      h('button', { class: 'btn sm', onclick: () => { cur = new Date(y, m + 1, 1); load(); } }, 'Next')));
    const g = h('div', { class: 'cal-g' });
    ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach((d) => g.appendChild(h('div', { class: 'cal-d dow' }, d)));
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) g.appendChild(h('div', { class: 'cal-d blank' }));
    const days = new Date(y, m + 1, 0).getDate();
    const today = ymd(new Date());
    for (let d = 1; d <= days; d++) {
      const s = ymd(new Date(y, m, d));
      const isOff = off.has(s);
      let cls = 'cal-d';
      if (isOff) cls += ' off';
      if (s < today) cls += ' past';
      if (s === start || s === end) cls += ' sel';
      else if (start && end && s > start && s < end) cls += ' rng';
      g.appendChild(h('div', { class: cls, 'data-day': s, onclick: isOff ? null : () => pick(s) }, d));
    }
    box.appendChild(g);
    box.appendChild(note);
    box.appendChild(h('div', { class: 'tiny muted' }, start ? ('Selected: ' + start + (end ? ' to ' + end : ' (pick an end date)')) : 'Pick a start date, then an end date.'));
  }
  box.reload = load;
  box.selection = () => ({ start, end });
  box.reset = () => { start = null; end = null; draw(); };
  draw(); load();
  return box;
}

function screenDiscover(root) {
  const modes = ['Search', 'Short term', 'Nearby', 'City', 'Map bounds'];
  let mode = store.get('pl-dmode', 'Search');
  const f = {
    query: h('input', { placeholder: 'e.g. studio' }),
    category: sel(['', 'SHORT_TERM_RENTAL', 'LONG_TERM_RENTAL', 'LEASE', 'HOUSE_SALE', 'LAND_SALE'], ''),
    city: h('input', { placeholder: 'City', value: 'Nairobi' }),
    minPrice: h('input', { type: 'number' }),
    maxPrice: h('input', { type: 'number' }),
    lat: h('input', { type: 'number', step: 'any', value: -1.2921 }), lng: h('input', { type: 'number', step: 'any', value: 36.8219 }), radius: h('input', { type: 'number', value: 10 }),
    minLat: h('input', { type: 'number', step: 'any', value: -1.3 }), maxLat: h('input', { type: 'number', step: 'any', value: -1.2 }),
    minLng: h('input', { type: 'number', step: 'any', value: 36.7 }), maxLng: h('input', { type: 'number', step: 'any', value: 36.9 })
  };
  const results = h('div');
  const filters = h('div', { class: 'filters' });
  const pills = h('div', { class: 'pill-tabs' });

  function drawFilters() {
    clear(filters);
    const F = (label, el) => field(label, el);
    if (mode === 'Search') filters.append(F('Keyword', f.query), F('Category', f.category), F('City', f.city), F('Min price', f.minPrice), F('Max price', f.maxPrice));
    if (mode === 'Short term') filters.append(F('City', f.city));
    if (mode === 'Nearby') filters.append(F('Latitude', f.lat), F('Longitude', f.lng), F('Radius (km)', f.radius), h('button', { class: 'btn', onclick: () => navigator.geolocation && navigator.geolocation.getCurrentPosition((p) => { f.lat.value = p.coords.latitude; f.lng.value = p.coords.longitude; }, () => toast('Location access was blocked', 'bad')) }, 'Use my location'));
    if (mode === 'City') filters.append(F('City', f.city));
    if (mode === 'Map bounds') filters.append(F('Min latitude', f.minLat), F('Max latitude', f.maxLat), F('Min longitude', f.minLng), F('Max longitude', f.maxLng));
    filters.append(h('button', { class: 'btn primary', onclick: (e) => run(e.currentTarget) }, 'Search'));
    $$('button', pills).forEach((b) => b.classList.toggle('on', b.textContent === mode));
  }
  modes.forEach((m) => pills.appendChild(h('button', { onclick: () => { mode = m; store.set('pl-dmode', m); drawFilters(); run(); } }, m)));

  async function run(btn) {
    let path; let query = {};
    if (mode === 'Search') { path = '/listings/search'; query = { query: f.query.value, category: f.category.value, city: f.city.value, minPrice: f.minPrice.value, maxPrice: f.maxPrice.value }; }
    if (mode === 'Short term') { path = '/listings/short-term'; query = { city: f.city.value }; }
    if (mode === 'Nearby') { path = '/locations/nearby'; query = { latitude: f.lat.value, longitude: f.lng.value, radiusKm: f.radius.value }; }
    if (mode === 'City') { path = '/locations/city'; query = { city: f.city.value }; }
    if (mode === 'Map bounds') { path = '/locations/bounds'; query = { minLat: f.minLat.value, maxLat: f.maxLat.value, minLng: f.minLng.value, maxLng: f.maxLng.value }; }
    clear(results).appendChild(h('div', { class: 'empty' }, 'Searching...'));
    const res = await withBusy(btn, () => api('listing', path, { query, anon: true }));
    clear(results);
    if (!res.ok) { results.appendChild(h('div', { class: 'notice bad' }, errText(res), res.hint ? h('div', { class: 'tiny' }, res.hint) : null)); results.appendChild(resultBox(res, {})); return; }
    const list = asList(res.data) || [];
    results.appendChild(h('div', { class: 'row', style: { marginBottom: '10px' } }, h('b', null, list.length + ' result(s)'), h('span', { class: 'muted tiny' }, res.method + ' ' + res.url),
      h('button', { class: 'btn sm', onclick: () => { clear(results).appendChild(resultBox(res, {})); } }, 'Raw response')));
    results.appendChild(listingGrid(list));
  }

  root.append(
    pageHead('Discover', 'Live listings from the search, location and short term endpoints. Open one to check dates, book or send an interest.'),
    h('div', { class: 'toolbar' }, pills, filters),
    results);
  drawFilters();
  run();
}

function listingForm(preloadId) {
  const inputs = {};
  const grid = h('div', { class: 'grid g3' });
  const files = h('input', { type: 'file', multiple: true, accept: 'image/*' });
  const showAll = h('input', { type: 'checkbox' });
  const idIn = h('input', { type: 'text', value: preloadId || '', placeholder: 'Listing id to edit (blank to create)' });
  const out = h('div');
  const prev = h('div', { class: 'row gap-s' });

  FORM_FIELDS.forEach((f) => {
    let el;
    if (f.t === 'select') el = sel(f.opts, f.opts[0]);
    else if (f.t === 'bool') el = h('input', { type: 'checkbox' });
    else if (f.t === 'textarea') el = h('textarea', { style: { fontFamily: 'var(--sans)', minHeight: '70px' } });
    else el = h('input', { type: f.t === 'number' ? 'number' : 'text', step: f.t === 'number' ? 'any' : undefined });
    inputs[f.n] = el;
    f.wrap = f.t === 'bool' ? h('label', { class: 'chk' }, el, f.n) : field(f.n, el, f.hint ? '(' + f.hint + ')' : '');
    if (f.wide) f.wrap.style.gridColumn = '1 / -1';
    grid.appendChild(f.wrap);
  });

  const apply = () => {
    const cat = inputs.category.value;
    FORM_FIELDS.forEach((f) => { f.wrap.classList.toggle('hidden', !!f.cats && !showAll.checked && !f.cats.includes(cat)); });
  };
  inputs.category.addEventListener('input', apply);
  showAll.addEventListener('input', apply);

  const fill = (l) => {
    FORM_FIELDS.forEach((f) => {
      const v = l[f.n]; const el = inputs[f.n];
      if (f.t === 'bool') el.checked = !!v;
      else if (f.t === 'list') el.value = Array.isArray(v) ? v.join(', ') : '';
      else if (v !== undefined && v !== null) el.value = v;
    });
    apply();
  };
  const sample = () => fill({ title: 'Cozy Studio in Kilimani', description: 'Bright, modern studio near Yaya Centre.', category: 'SHORT_TERM_RENTAL', pricePerDay: 40, pricePerNight: 55, latitude: -1.2921, longitude: 36.7833, address: 'Argwings Kodhek Road', city: 'Nairobi', country: 'Kenya', maxGuests: 2, cancellationPolicy: 'MODERATE', bedrooms: 1, bathrooms: 1, hasWifi: true, hasKitchen: true, amenities: ['Parking', 'Backup Generator'] });

  const load = async (btn) => {
    if (!idIn.value) { toast('Enter a listing id', 'bad'); return; }
    const res = await withBusy(btn, () => api('listing', '/listings/' + encodeURIComponent(idIn.value), { anon: true }));
    if (!res.ok) { toast(errText(res), 'bad'); return; }
    fill(unwrap(res.data) || {}); setCtx('listing_id', idIn.value); toast('Loaded into the form');
  };

  const build = () => {
    const o = {};
    FORM_FIELDS.forEach((f) => {
      const el = inputs[f.n];
      if (f.wrap.classList.contains('hidden')) return;
      if (f.t === 'bool') { if (el.checked) o[f.n] = true; return; }
      if (el.value === '') return;
      o[f.n] = f.t === 'number' ? Number(el.value) : f.t === 'list' ? el.value.split(',').map((x) => x.trim()).filter(Boolean) : el.value;
    });
    return o;
  };

  const submit = async (btn) => {
    const editing = idIn.value.trim();
    const fd = new FormData();
    fd.append('request', new Blob([JSON.stringify(build())], { type: 'application/json' }));
    [...files.files].forEach((f) => fd.append('files', f, f.name));
    const res = await withBusy(btn, () => api('listing', editing ? '/listings/' + encodeURIComponent(editing) : '/listings', { method: editing ? 'PUT' : 'POST', form: fd }));
    clear(out).appendChild(resultBox(res, {}));
    const d = unwrap(res.data);
    if (res.ok && d && d.id) { setCtx('listing_id', d.id); if (d.ownerId) setCtx('owner_id', d.ownerId); idIn.value = d.id; }
    toast(res.ok ? (editing ? 'Listing updated' : 'Listing created') : errText(res), res.ok ? 'ok' : 'bad');
  };

  files.addEventListener('input', () => {
    clear(prev);
    [...files.files].forEach((f) => prev.appendChild(h('img', { src: URL.createObjectURL(f), style: { width: '64px', height: '48px', objectFit: 'cover', borderRadius: '6px' } })));
  });

  apply();
  if (preloadId) setTimeout(() => load(), 0);
  return h('div', { class: 'card' },
    h('div', { class: 'card-h' }, h('h3', null, 'Create or edit a listing'), h('span', { class: 'tag' }, 'POST or PUT /listings')),
    h('div', { class: 'row', style: { marginBottom: '12px' } }, h('div', { style: { flex: 1, minWidth: '240px' } }, idIn),
      h('button', { class: 'btn', onclick: (e) => load(e.currentTarget) }, 'Load listing'), h('button', { class: 'btn', onclick: () => { idIn.value = ''; sample(); } }, 'Fill sample'),
      h('label', { class: 'chk tiny' }, showAll, 'Show every field')),
    grid,
    h('div', { class: 'row', style: { margin: '12px 0' } }, field('Images', files), prev),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: (e) => submit(e.currentTarget) }, 'Save listing'),
      h('span', { class: 'muted tiny' }, 'Blank id creates (POST). An id updates (PUT). New listings start as PENDING until an admin approves them.')),
    out);
}

async function loadRates(quiet) {
  const res = await api('listing', '/currency/rates', { anon: true });
  if (!res.ok) { if (!quiet) toast('Rates: ' + errText(res), 'bad'); return false; }
  let d = unwrap(res.data);
  if (d && d.rates && typeof d.rates === 'object') d = d.rates;
  if (d && typeof d === 'object' && !Array.isArray(d)) {
    S.rates = {}; Object.keys(d).forEach((k) => { if (typeof d[k] === 'number') S.rates[k] = d[k]; });
    if (!('USD' in S.rates)) S.rates.USD = 1;
    emit('rates');
    return true;
  }
  return false;
}

async function pingAll() {
  const el = $('#health'); const dot = $('.dot', el);
  const checks = [['listing', '/system/health'], ['auth', '/actuator/health'], ['wallet', '/actuator/health']];
  const out = [];
  for (const [svc, path] of checks) {
    const r = await api(svc, path, { anon: true });
    out.push({ svc, ok: r.status > 0 && r.status < 500, status: r.status });

  S.health = out;

function substVars(str, missing) {
  const vars = explorerVars();
  return String(str).replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, n) => {
    if (n === '$guid') return uid();
    if (n === '$timestamp') return String(Math.floor(Date.now() / 1000));
    if (n === '$randomInt') return String(Math.floor(Math.random() * 1000));
    if (n === 'listing_idempotency_key' || n === 'idempotency_key') {
      if (vars.retry_same_key === 'true' && S.lastIdem) return S.lastIdem;
      S.lastIdem = uid(); return S.lastIdem;
    }
    if (vars[n] !== undefined && vars[n] !== '') return vars[n];
    if (missing) missing.push(n);
    return m;
  });
}

    const q = search.value.toLowerCase();
    let folder = '';
    EXPLORER.forEach((e, i) => {
      if (q && !(e.name + ' ' + e.method + ' ' + e.url).toLowerCase().includes(q)) return;
      if (e.folder !== folder) { folder = e.folder; listEl.appendChild(h('h4', { style: { margin: '10px 4px 4px' } }, folder)); }
      listEl.appendChild(h('div', { class: 'logr' + (i === selIdx ? ' on' : ''), 'data-i': i, onclick: () => { selIdx = i; drawList(); drawEditor(e); } },
        h('span', { class: 'method m-' + e.method }, e.method), h('span', null, e.name)));
    });
  };
  search.addEventListener('input', drawList);

  function drawEditor(e) {
    clear(editor);
    const method = sel(['GET', 'POST', 'PUT', 'PATCH', 'DELETE'], e.method);
    const url = h('input', { type: 'text', value: e.url, class: 'mono' });
    const headers = h('textarea', { style: { minHeight: '70px' } }, e.headers.filter((x) => !x.off).map((x) => x.k + ': ' + x.v).join('\n'));
    const authOpts = [{ v: 'active', l: 'Active persona (' + personaLabel(S.active) + ')' }].concat(PERSONAS.map((p) => ({ v: p.id, l: p.label }))).concat([{ v: 'none', l: 'No token' }]);
    const defAuth = e.auth === 'admin_token' ? 'admin' : e.auth === 'home_owner_token' ? 'home_owner' : e.auth === 'none' ? 'none' : 'active';
    const auth = sel(authOpts, defAuth);
    let bodyEl = null; const formRows = [];
    if (e.body && e.body.mode === 'raw') bodyEl = h('textarea', { style: { minHeight: '140px' } }, e.body.raw || '');
    if (e.body && e.body.mode === 'formdata') {
      bodyEl = h('div', { class: 'col' });
      e.body.form.forEach((r) => {
        const inp = r.t === 'file' ? h('input', { type: 'file', multiple: true }) : h('textarea', { style: { minHeight: r.v && r.v.length > 60 ? '150px' : '40px' } }, r.v || '');
        formRows.push({ r, inp });
        bodyEl.appendChild(field(r.k + (r.t === 'file' ? ' (file)' : ''), inp));
      });
    }
    const out = h('div');
    const send = async (btn) => {
      const missing = [];
      const finalUrl = substVars(url.value, missing);
      const hd = {};
      headers.value.split('\n').forEach((line) => { const i = line.indexOf(':'); if (i > 0) hd[line.slice(0, i).trim()] = substVars(line.slice(i + 1).trim(), missing); });
      const opts = { method: method.value, headers: hd };
      if (auth.value === 'none') opts.anon = true; else { const pid = auth.value === 'active' ? S.active : auth.value; const tok = (S.personas[pid] || {}).token; if (tok) { opts.token = tok; } else { opts.anon = true; toast(personaLabel(pid) + ' is not signed in, sending without a token', 'bad'); } }
      if (/\/internal\//.test(finalUrl)) { opts.anon = true; opts.apiKey = S.cfg.apiKey; }
      if (e.body && e.body.mode === 'raw' && bodyEl.value.trim()) opts.raw = substVars(bodyEl.value, missing);
      if (e.body && e.body.mode === 'formdata') {
        const fd = new FormData();
        formRows.forEach(({ r, inp }) => {
          if (r.t === 'file') [...inp.files].forEach((f) => fd.append(r.k, f, f.name));
          else { const val = substVars(inp.value, missing); if (/^\s*[{[]/.test(val)) fd.append(r.k, new Blob([val], { type: 'application/json' })); else fd.append(r.k, val); }
        });
        opts.form = fd;
      }
      if (missing.length) toast('Unresolved variables: ' + [...new Set(missing)].join(', '), 'bad');
      const res = await withBusy(btn, () => api('x', finalUrl, opts));
      clear(out).appendChild(resultBox(res, {}));
      const d = unwrap(res.data);
      if (res.ok && d && typeof d === 'object') {
        if (d.id && /\/listings$/.test(finalUrl.split('?')[0]) && method.value === 'POST') setCtx('listing_id', d.id);
        if (d.id && /\/bookings$/.test(finalUrl.split('?')[0]) && method.value === 'POST') { setCtx('booking_id', d.id); setCtx('escrow_hold_reference', 'booking-' + d.id); }
        if (d.blockId) setCtx('block_id', d.blockId);
      }
    };
    editor.append(h('div', { class: 'card' },
      h('div', { class: 'card-h' }, h('h3', null, e.name), h('span', { class: 'chip' }, e.folder)),
      h('div', { class: 'row', style: { flexWrap: 'nowrap' } }, h('div', { style: { width: '110px' } }, method), h('div', { style: { flex: 1 } }, url), h('button', { class: 'btn primary', onclick: (ev) => send(ev.currentTarget) }, 'Send')),
      h('div', { class: 'grid g2', style: { marginTop: '10px' } }, field('Auth', auth), field('Headers', headers)),
      bodyEl ? h('div', { style: { marginTop: '10px' } }, h('h4', { style: { marginBottom: '6px' } }, 'Body'), bodyEl) : null,
      out), varsPanel());
  }

  function varsPanel() {
    const mineVars = store.get('pl-vars', {});
    const body = h('div', { class: 'col' });
    const draw = () => {
      clear(body);
      const vars = store.get('pl-vars', {});
      Object.keys(vars).forEach((k) => body.appendChild(h('div', { class: 'row', style: { flexWrap: 'nowrap' } }, h('code', { style: { minWidth: '160px' } }, k), h('input', { type: 'text', value: vars[k], onchange: (e) => { const v = store.get('pl-vars', {}); v[k] = e.target.value; store.set('pl-vars', v); } }),
        h('button', { class: 'btn sm danger', onclick: () => { const v = store.get('pl-vars', {}); delete v[k]; store.set('pl-vars', v); draw(); } }, 'Remove'))));
      const n = h('input', { type: 'text', placeholder: 'name, e.g. retry_same_key' }); const val = h('input', { type: 'text', placeholder: 'value' });
      body.appendChild(h('div', { class: 'row', style: { flexWrap: 'nowrap' } }, n, val, h('button', { class: 'btn sm', onclick: () => { if (!n.value) return; const v = store.get('pl-vars', {}); v[n.value.trim()] = val.value; store.set('pl-vars', v); draw(); } }, 'Add')));
    };
    draw();
    return h('details', { class: 'card flat' }, h('summary', { style: { cursor: 'pointer', fontWeight: 700 } }, 'Variables (' + Object.keys(mineVars).length + ' custom)'),
      h('p', { class: 'muted tiny' }, 'Built in: base_url_listing, base_url, base_url_wallet, token, internal_api_key, my_user_id and the working ids from the bar. Add retry_same_key = true to reuse the last idempotency key on the next send.'), body);
  }

  wrap.append(h('div', { class: 'col' }, search, listEl), editor);
  root.append(coverageBox(), h('div', { style: { height: '12px' } }), wrap);
  drawList();
  editor.appendChild(h('div', { class: 'empty' }, 'Pick a request on the left.'));
}

/* ====================== boot ====================== */
window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  buildShell();
  buildDock();
  go(S.screen === 'guide' || SCREENS.find((s) => s.id === S.screen) ? S.screen : 'guide');
  pingAll();
  if (S.currency !== 'USD') loadRates(true);
});


</script>
</body>
