spring:
  application:
    name: premisave-listing-service

  # Java 21 virtual threads — cheap mitigation for blocking calls (RestTemplate
  # to Frankfurter, Feign to auth-service/wallet-service) so they stop pinning
  # platform threads under load. Does not replace the circuit breakers below —
  # it just makes blocking cheaper while they're not tripped.
  threads:
    virtual:
      enabled: true

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/premisave-listing}
      # Lets @Indexed / @CompoundIndex annotations actually create indexes on
      # startup. Fine for dev and for collections that are still small. On an
      # existing production collection with real data volume, building an
      # index at startup can stall the app or lock the collection for the
      # duration — prefer creating those indexes explicitly/out-of-band
      # (e.g. via a migration script or `db.collection.createIndex` run
      # ahead of a deploy) once there's real data, and turn this back off.
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false  # Prevents Redis from claiming MongoDB repositories

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  cloud:
    discovery:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true

  # No defaults on host/port/username/password on purpose — same reasoning
  # as INTERNAL_SERVICE_API_KEY/JWT_SECRET/Cloudinary below: fail loudly at
  # startup if unset, rather than silently trying to send mail through a
  # placeholder SMTP server.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# The "From" address EmailService uses — not a Spring Boot-recognized mail
# property (Spring's mail starter has no such setting), so it's its own
# top-level key rather than nested under spring.mail.* to avoid implying
# it's something Spring itself reads.
mail-from: ${MAIL_FROM:no-reply@premisave.com}

# ==================== Server ====================
server:
  port: 8082

# ==================== Auth Service ====================
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}

# ==================== Wallet Service ====================
# All payment execution (M-Pesa, PayPal, Stripe, Flutterwave, NOWPayments)
# now lives entirely in premisave-wallet-service. This service only calls
# its internal, service-to-service endpoint to debit an existing wallet
# balance — see WalletServiceClient / WalletApiKeyFeignInterceptor.
wallet:
  service:
    url: ${WALLET_SERVICE_URL:http://localhost:8084}

# One shared internal API key for service-to-service calls, meant to be
# the exact same value across every Premisave microservice (not just
# wallet-service — reuse this same property/value if listing-service ever
# needs to authenticate calls FROM another service too). No default value
# on purpose: a silently-wrong placeholder here caused a confusing 401 at
# request time instead of a clear failure at startup. Missing this
# property now fails the app on boot instead.
internal:
  service:
    api-key: ${INTERNAL_SERVICE_API_KEY}

# ==================== Mail ====================
# See spring.mail.* / mail-from at the top of this file, merged into the
# existing top-level spring: block rather than duplicated here — a second
# top-level spring: key in the same YAML file would silently clobber the
# first one's settings (Mongo URI, virtual threads, Feign circuit breaker
# config, etc.), which is exactly what this used to do before being fixed.

# ==================== JWT ====================
# No default on purpose — same reasoning as INTERNAL_SERVICE_API_KEY
# above: a real-looking placeholder here means the app silently signs and
# verifies tokens with a value anyone reading this file already has,
# rather than failing loudly if you forget to set your own.
jwt:
  secret: ${JWT_SECRET}

# ==================== Cloudinary ====================
# No defaults — these were previously real, working credentials
# committed directly in this file. Set your own in .env.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ==================== Rate Limiting ====================
# Per-key (user, falling back to IP) limit, enforced against a Redis-backed
# bucket so every instance agrees on the same count. See RateLimiterConfig /
# RateLimiterInterceptor — this used to be a single bucket shared by every
# user on the instance.
rate-limit:
  requests-per-minute: 100

# ==================== Ad Promotion ====================
ad:
  promotion:
    daily-rate: 2.99
    default-currency: USD
    # Cron expression for the expired-promotion sweep
    # (AdPromotionService.deactivateExpiredPromotions) — standard 6-field
    # Spring cron (seconds minutes hours day-of-month month day-of-week).
    # Defaults to every 5 minutes.
    expiry-check-cron: "0 */5 * * * *"

# Cron expression for the past-checkout booking sweep
# (BookingService.completeExpiredBookings) — same 6-field format as above.
# Defaults to every 5 minutes.
booking:
  completion-check-cron: "0 */5 * * * *"

# ====================== FRANKFURTER CURRENCY API ======================
# Display-only currency conversion for browsing listings. Actual payment
# settlement is handled by wallet-service, which has its own FX layer.
frankfurter:
  base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}

# ==================== Frontend / CORS ====================
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

cors:
  # Comma-separated list of allowed origins, e.g.
  # "https://app.premisave.com,https://admin.premisave.com". Falls back to
  # frontend.url above when unset (single-origin dev/local setups).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${frontend.url:http://localhost:3000}}

# ==================== Resilience4j (Feign: auth-service, wallet-service) ====================
# Applied via the "default" config to every circuit breaker/time limiter
# Spring Cloud OpenFeign creates per Feign client method — per-client tuning
# (e.g. a stricter threshold specifically for wallet-service) needs the
# actual generated instance names confirmed first (visible via the
# /actuator/health group once Actuator is added, or via DEBUG logging on
# io.github.resilience4j); left at sane shared defaults here rather than
# guessing at names that might not match and silently not apply.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

# ==================== Logging ====================
logging:
  level:
    "[com.premisave]": DEBUG
    "[org.springframework.data.mongodb]": WARN
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR